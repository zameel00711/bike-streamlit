[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bike"
version = "0.1.0"
description = "Bike sharing demand prediction app and training pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas==3.1.0",
    "numpy==2.5.4",
    "matplotlib==3.11.2",
    "seaborn==0.13.2",
    "scikit-learn==1.9.1",
    "streamlit==1.66.1",
    "joblib==1.6.0",
]

[tool.setuptools]
py-modules = ["bike_sharing", "main", "streamlit_app", "train_model"]
